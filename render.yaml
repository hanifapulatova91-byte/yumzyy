# Render Blueprint — YumZy backend + frontend
#
# Deploy: Render Dashboard → New → Blueprint → connect this repo.
# Render reads this file and provisions both services.
#
# Two-URL model:
#   - GitHub Pages (auto):  https://hanifapulatova91-byte.github.io/yumzyy/   → demo-mode fallback
#   - Render static site:   https://yumzy-web.onrender.com                    → real backend, real AI

services:
  # -----------------------------------------------------------------
  # Backend API (Node + Express + Mongo + OpenAI)
  # -----------------------------------------------------------------
  - type: web
    name: yumzy-api
    env: node
    region: frankfurt   # closest free region to Uzbekistan
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false            # set manually in Render dashboard (secret)
      - key: JWT_SECRET
        generateValue: true    # Render auto-generates a strong random string
      - key: OPENAI_API_KEY
        sync: false            # set manually in Render dashboard (secret)
      - key: FRONTEND_URL
        value: https://yumzy-web.onrender.com

  # -----------------------------------------------------------------
  # Frontend static site — real-backend build of the same React app
  # -----------------------------------------------------------------
  - type: web
    name: yumzy-web
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_BASE
        value: /
      - key: VITE_API_URL
        value: https://yumzy-api-rbo2.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
